<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.5 4.5 379.1 304.9" width="100%" height="100%" role="img" aria-label="libelli — the hand-lettered wordmark, with a dragonfly over it">
<!-- The cover: logo.svg's mark drawn with a pen a third as wide, filled with
     currentColor so it takes the color of whatever holds it, and sized by the
     container rather than in pixels. The path was derived from logo.svg's, not
     copied: its outline thinned to a centreline, that line given an even width
     of about 4 units (the logo's is about 12) with round ends, and the two
     dots scaled to a third about their centres. Still outlines, not strokes,
     so the ink scales with the path; the viewBox is trimmed to the thinner
     ink. Kept out of static/ so the service worker does not precache a copy
     the app never shows. -->
