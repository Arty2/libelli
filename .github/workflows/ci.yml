name: CI

on:
  pull_request:
  push:
    branches: [main]
  # So the suite can be asked for by hand without pushing a commit to ask with.
  workflow_dispatch:

# A force-push supersedes the run it interrupts, and finishing that run buys
# nothing. This is where the minutes actually go on a branch under review.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # First, and not because it is quick — because it is the only step that
      # checks the rules AGENTS.md states and nothing else executes. See
      # docs/decisions.md § scripts/gates.sh.
      - run: npm run gates

      # Fastest signal first, so a broken unit fails in seconds rather than
      # after a build. One job rather than a matrix: this app targets browsers,
      # not several Node versions, so a matrix would triple the minutes for
      # nothing.
      - run: npm test

      - run: npm run check

      - run: npm run build
